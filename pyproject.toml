[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "broadcast-python"
version = "0.1.0"
description = "Python client for the Broadcast email platform. Subscribers, sequences, broadcasts, segments, templates, autopilot, webhooks, and transactional email."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Simon Chiu" }]
keywords = ["broadcast", "email", "newsletter", "transactional", "email-marketing", "sendbroadcast"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications :: Email",
]

# No runtime dependencies, deliberately. The client is built on urllib from the
# standard library, so installing it into a Lambda, a Django app, or a cron
# script pulls in nothing else and cannot conflict with a pinned requests or
# httpx elsewhere in the environment.
dependencies = []

[project.urls]
Homepage = "https://sendbroadcast.net"
Repository = "https://github.com/send-broadcast/broadcast-python"
Changelog = "https://github.com/send-broadcast/broadcast-python/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/broadcast"]

[tool.hatch.build.targets.sdist]
include = ["src/broadcast", "README.md", "CHANGELOG.md", "LICENSE"]
